name: Change a draft release's notes

# Puts main's release-notes/<version>.txt into an existing DRAFT release's
# latest.json as its "notes", which is what the update window shows under
# "What's new". Run it by pushing notes-v<version>: notes-v0.1.4 changes the
# v0.1.4 draft. Nothing else changes. The rest of latest.json stays byte for
# byte, and the other files are checked by name, size and SHA-256 before and
# after. The notes aren't part of any signature, so no key is needed and no
# secret is used. Each update signature in latest.json is still checked against
# the public key built into the app, for this version, before anything is
# uploaded.

on:
  push:
    tags: ["notes-v*"]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Replace the draft's notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG#notes-}"
          v="${tag#v}"
          echo "::notice title=notes source::release-notes/$v.txt on main at $(git rev-parse --short HEAD)"
          if [ ! -s "release-notes/$v.txt" ]; then
            echo "::error title=no release notes::main has no release-notes/$v.txt; nothing was changed."
            exit 1
          fi
          rel=$(gh api "repos/$REPO/releases?per_page=50" --jq "[.[] | select(.tag_name == \"$tag\" and .draft == true)] | first")
          if [ -z "$rel" ] || [ "$rel" = "null" ]; then
            echo "::error title=no draft::There is no draft release for $tag; nothing was changed."
            exit 1
          fi
          id=$(echo "$rel" | jq -r .id)
          list='[.assets[] | "\(.name) \(.size) \(.digest)"] | sort | .[]'
          echo "$rel" | jq -r "$list" > before.txt
          echo "::notice title=draft files before::$(awk 'BEGIN{ORS="%0A"} {print}' before.txt)"
          asset() {
            local aid
            aid=$(echo "$rel" | jq -r --arg n "$1" '.assets[] | select(.name == $n) | .id')
            if [ -z "$aid" ]; then echo "::error title=missing file::The draft has no $1; nothing was changed."; exit 1; fi
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$aid" > "$2"
          }
          mkdir -p old new files
          asset latest.json old/latest.json
          for f in "SignFlow-Helper_${v}_x64-setup.exe" "SignFlow-Helper_${v}_universal.app.tar.gz"; do
            asset "$f" "files/$f"
            asset "$f.sig" "files/$f.sig"
          done

          # The new latest.json: only the "notes" line differs.
          V="$v" BASE="https://github.com/$REPO/releases/download/$tag" node <<'JS'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const v = process.env.V, base = process.env.BASE;
          const fail = (m) => { console.log(`::error title=latest.json::${m} Nothing was changed.`); process.exit(1); };
          const raw = fs.readFileSync("old/latest.json", "utf8");
          const old = JSON.parse(raw);
          if (raw !== JSON.stringify(old, null, 2) + "\n") fail("The draft's latest.json isn't laid out the way release.yml writes it.");
          if (old.version !== v) fail(`The draft's latest.json is for ${old.version}, not ${v}.`);
          if (typeof old.notes !== "string") fail("The draft's latest.json has no notes.");
          const notes = fs.readFileSync(`release-notes/${v}.txt`, "utf8").trim();
          const out = JSON.stringify({ ...old, notes }, null, 2) + "\n";
          const a = raw.split("\n"), b = out.split("\n");
          const changed = a.flatMap((l, i) => (l === b[i] ? [] : [i]));
          if (a.length !== b.length || changed.length !== 1 || !a[changed[0]].startsWith('  "notes": ')) fail(`Lines other than the notes would change (${changed.join(", ")}).`);
          // Each platform's update, as the updater would take it from this file.
          for (const [platform, { url, signature }] of Object.entries(old.platforms)) {
            const name = url.slice(base.length + 1);
            if (!url.startsWith(base + "/") || !fs.existsSync(`files/${name}`)) fail(`${platform} points at ${url}.`);
            if (signature.trim() !== fs.readFileSync(`files/${name}.sig`, "utf8").trim()) fail(`${platform}'s signature isn't ${name}.sig.`);
            fs.writeFileSync("sig.tmp", signature);
            let res;
            try {
              res = execFileSync("node", ["tools/verify-update.mjs", "src-tauri/tauri.conf.json", `files/${name}`, "sig.tmp", v], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }).trim();
            } catch (e) {
              fail(`${platform}: ${String(e.stderr || e.message).trim()}.`);
            }
            console.log(`::notice title=signature checked (${platform})::${res}`);
          }
          fs.writeFileSync("new/latest.json", out);
          console.log(`::notice title=notes before::${JSON.stringify(old.notes)}`);
          console.log(`::notice title=notes after::${JSON.stringify(notes)}`);
          console.log(`::notice title=latest.json line ${changed[0] + 1}::${a[changed[0]].trim()}%0A→ ${b[changed[0]].trim()}`);
          JS

          gh release upload "$tag" new/latest.json --repo "$REPO" --clobber

          # The same release, still a draft, the other files untouched, and
          # the new latest.json exactly as made.
          pub=$(gh api "repos/$REPO/releases/$id")
          if [ "$(echo "$pub" | jq -r .draft)" != "true" ]; then echo "::error title=not a draft::$tag is no longer a draft."; exit 1; fi
          echo "$pub" | jq -r "$list" > after.txt
          echo "::notice title=draft files after::$(awk 'BEGIN{ORS="%0A"} {print}' after.txt)"
          if ! cmp -s <(grep -v '^latest.json ' before.txt) <(grep -v '^latest.json ' after.txt); then
            echo "::error title=files differ::Files other than latest.json changed."; exit 1
          fi
          want="latest.json $(stat -c%s new/latest.json) sha256:$(sha256sum new/latest.json | cut -d' ' -f1)"
          if ! grep -qxF "$want" after.txt; then echo "::error title=latest.json differs::wanted $want"; exit 1; fi
          rel=$pub
          asset latest.json back.json
          cmp new/latest.json back.json
          echo "::notice title=notes changed::$tag is still a draft; its latest.json now says: $(jq -r .notes back.json)"
