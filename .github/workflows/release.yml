name: Release

# Makes a DRAFT release (not public) with the Windows installer, its update
# signature and latest.json for the updater. Run it by pushing a version tag
# (v0.1.0) or with "Run workflow". The update-signing key comes only from the
# repository's secret settings; nothing in this repository is a secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install the Tauri CLI
        run: npm ci

      - name: Tests first
        working-directory: src-tauri
        run: cargo test --color never -- --test-threads 1

      - name: Check the tag matches the app's version
        if: github.ref_type == 'tag'
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$v") {
            Write-Host "::error title=version mismatch::The tag is ${{ github.ref_name }} but src-tauri/tauri.conf.json says $v. Change the version there (and in src-tauri/Cargo.toml and package.json), then tag v<that version>."
            exit 1
          }

      - name: Build the installer and sign the update
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Pasted secrets can pick up a space or line break at either end;
          # the key and password themselves never have one.
          $key = "$env:KEY".Trim()
          $password = "$env:PASSWORD".Trim()
          if (-not $key -or -not $password) {
            Write-Host "::error title=signing key missing::Add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          }
          # Its shape only, never its contents: the key file is base64 of a
          # minisign "untrusted comment" block.
          $shape = try { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key)).StartsWith("untrusted comment:") } catch { $false }
          if (-not $shape) {
            Write-Host "::error title=signing key unreadable::TAURI_SIGNING_PRIVATE_KEY isn't the whole contents of TAURI_SIGNING_PRIVATE_KEY.txt. Paste it again (all of it, nothing else)."
            exit 1
          }
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $password
          npx tauri build --bundles nsis 2>&1 | Tee-Object -FilePath build-release.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build-release.log | Where-Object { $_ -match 'error|failed|Error|wrong|password|key' } | Select-Object -Last 15) -join "%0A"
            Write-Host "::error title=release build failed::$tail"
            exit 1
          }

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_${v}_x64-setup.exe" | Select-Object -First 1
          $sig = Get-Item "$($setup.FullName).sig"
          # A name without spaces, so the download link is the file's name.
          $name = "SignFlow-Helper_${v}_x64-setup.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup.FullName "dist/$name"
          Copy-Item $sig.FullName "dist/$name.sig"
          $latest = [ordered]@{
            version = $v
            notes = "SignFlow Helper $v"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json

          $existing = gh release view $tag --json isDraft 2>$null | ConvertFrom-Json
          if ($existing -and -not $existing.isDraft) {
            Write-Host "::error title=already published::$tag is already a published release; it is left alone. Raise the version to make a new one."
            exit 1
          }
          if ($existing) {
            gh release upload $tag "dist/$name" "dist/$name.sig" dist/latest.json --clobber
          } else {
            gh release create $tag "dist/$name" "dist/$name.sig" dist/latest.json --draft --target "${{ github.sha }}" --title "SignFlow Helper $tag" --notes "Windows 11 installer for the SignFlow Helper. Draft: not published, not public."
          }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=release failed::gh couldn't make the draft release."; exit 1 }
          $f = Get-Item "dist/$name"
          Write-Host "::notice title=release file::$name, $([math]::Round($f.Length / 1MB, 2)) MB ($($f.Length) bytes); built as $($setup.Name)"
          Write-Host "::notice title=draft release::$tag (draft, not public): $(gh release view $tag --json url --jq .url)"
